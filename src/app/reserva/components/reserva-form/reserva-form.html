<div class="container">

  <mat-dialog-content>

    <h1 mat-dialog-title>Gestión de reservas</h1>
  
    <form [formGroup]="reservaForm" (ngSubmit)="guardar()">

      <!-- Fecha de inicio -->
      <section>
        <app-input-date
          label="Fecha de inicio"
          [control]="fechaInicio"
          errorMessage="La fecha de inicio no es válida"
        ></app-input-date>
      </section>

        <!-- Fecha de fin -->
        <section>
        <app-input-date
          label="Fecha de fin"
          [control]="fechaFin"
          errorMessage="La fecha de fin no es válida"
        ></app-input-date>
      </section>

        @if(!idReserva) {
        <!-- Botón de guardado -->
        <button matButton type="submit">Guardar</button>
        }
      </form>
      
  </mat-dialog-content>
</div>
