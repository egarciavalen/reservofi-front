<div class="container">

  <mat-dialog-content>

    <h1 mat-dialog-title>Gestión de reservas</h1>
  
    <form [formGroup]="reservaForm" (ngSubmit)="guardar()">

      <!-- Fecha de inicio -->
      <section>
        <app-input-date
          label="Fecha de inicio"
          [control]="fechaInicio"
          errorMessage="La fecha de inicio no es válida"
        ></app-input-date>
      </section>

        <!-- Fecha de fin -->
        <section>
        <app-input-date
          label="Fecha de fin"
          [control]="fechaFin"
          errorMessage="La fecha de fin no es válida"
        ></app-input-date>
      </section>

      <div class="btn-form">
        <button matButton type="submit">Guardar</button>
        <button matButton class="cancelar" type="button" (click)="cerrarDialogo()">Cancelar</button>
      </div>
    
    </form>
      
  </mat-dialog-content>
</div>
