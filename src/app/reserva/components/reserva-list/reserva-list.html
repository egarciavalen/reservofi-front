<h2>Lista de reservas</h2>

<table>
  <thead>
    <tr>
      <th>Identificador</th>
      <th>Fecha de inicio</th>
      <th>Fecha de finalización</th>
    </tr>
  </thead>
  <tbody>
    @for (reservaDTO of reservaDTOList(); track reservaDTO.id) {
      <tr>
         <td>{{ reservaDTO.id }}</td>
         <td>{{ reservaDTO.fechaInicio | formatDate }}</td>  
         <td>{{ reservaDTO.fechaFin | formatDate }}</td>        
         <td>
            <button (click)="editarReserva(reservaDTO.id)">Actualizar</button>
         </td>
      </tr>
    } 
  </tbody>
</table>
