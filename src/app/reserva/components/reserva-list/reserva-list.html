
<div class="container">
  
  <h1>Lista de reservas</h1>

  <div class="reserva-container">
    @for (reservaDTO of reservaDTOList(); track reservaDTO.id) {
      <!-- Creación de cards para la visualización de las salas-->
      <mat-card class="reserva-card">
      <mat-card-header>
        <mat-card-title>{{reservaDTO.fechaInicio | formatDate}} - {{reservaDTO.fechaFin | formatDate}}</mat-card-title>
        <!--
          <mat-card-subtitle>{{reservaDTO.nombrePuesto}} - {{reservaDTO.nombreSala}}</mat-card-subtitle>
        -->
      </mat-card-header>
      <mat-card-content>
        <!-- Imagen de la sala -->
        <!--
        <img mat-card-image src="{{reservaDTO.rutaImagen}}" alt="Fotografía de la sala {{reservaDTO.nombreSala}} asociada a la reserva">
      -->
      </mat-card-content>
      <mat-card-actions>
        <button matButton class="btn-edit" (click)="borrarReserva(reservaDTO.id)"><mat-icon>delete</mat-icon></button>
      </mat-card-actions>
    </mat-card>
    } 
  </div>
</div>
