<h2>Mapa</h2>
<p>Mapa donde se procede a la visualización de las salas, puestos y reservas</p>

<div class="map">

  <div class="selector">
    @for(salaDTO of salaDTOList(); track salaDTO.id) {
      <button (click)="establecerSala(salaDTO.id)">{{salaDTO.nombre}}</button>

    }
  </div>

  <div class="visor"
    (mousedown)="pulsarRaton($event)"
    (mousemove)="moverRaton($event)"
    (mouseup)="finalizarRaton()">
    @if(mapaDTO.salaDTO) {
          <img src= {{mapaDTO.rutaImagenSala}} alt="Sala seleccionada" draggable="false">
    }

  </div>

</div>
