<div class="container">

  <mat-dialog-content>

    <h1 mat-dialog-title>Gestión de puestos</h1>
    
    <form [formGroup]="puestoForm" (ngSubmit)="guardar()">

      <!-- Nombre -->
      <section>
        <app-input-text
          label="Nombre"
          [control]="nombre"
          type="text"
          errorMessage="Nombre no es válido">
        </app-input-text>
      </section>

      <div class="btn-form">
        <button matButton type="submit">Guardar</button>
        <button matButton class="cancelar" type="button" (click)="cerrarDialogo()">Cancelar</button>
      </div>
    </form>

  </mat-dialog-content>
</div>
