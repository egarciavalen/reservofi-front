<div class="container">

  <mat-dialog-content>

    <h1 mat-dialog-title>Gestión de puestos</h1>
    
    <form [formGroup]="puestoForm" (ngSubmit)="guardar()">

      <!-- Nombre -->
      <section>
        <app-input-text
          label="Nombre"
          [control]="nombre"
          type="text"
          errorMessage="Nombre no es válido">
        </app-input-text>
      </section>

      <!-- Botón de guardado -->
      <button matButton type="submit">Guardar</button>
    </form>

  </mat-dialog-content>
</div>
