<mat-form-field appearance="fill">
  <mat-label>{{ label }}: </mat-label>
  <input
    matInput
    type="email"
    [formControl]="control"
    [placeholder]="placeholder || ''"
    autocomplete="email"
  />
  
  @if(control.invalid && (control.dirty || control.touched)) {
    <mat-error>
      {{ errorMessageToShow || errorMessage }}
    </mat-error>
  }

</mat-form-field>
