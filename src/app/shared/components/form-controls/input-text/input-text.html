<mat-form-field appearance="fill">
  <mat-label>{{ label }}: </mat-label>
  <input
    matInput
    [type]="type || 'text'"
    [formControl]="control"
    [placeholder]="placeholder || ''"
  />

  @if(control.invalid && (control.dirty || control.touched)) {
    <mat-error>
      {{ errorMessageToShow || errorMessage }}
    </mat-error>
  }
</mat-form-field>
