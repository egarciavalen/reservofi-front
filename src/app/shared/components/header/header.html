@if(!autenticado()) {
  <mat-toolbar>
    <button matButton="filled" (click)="home()">Inicio</button>
    <button matButton="filled" (click)="login()">Iniciar sesión</button>
    <button matButton="filled" (click)="register()">Registro</button>
    <button matButton="filled" class="logout" (click)="logout()">Cerrar sesión</button>
  </mat-toolbar>
}

@if(autenticado()) {
  <mat-toolbar>
    <button matButton="filled" (click)="home()">Inicio</button>
    <button matButton="filled" (click)="map()">Mapa</button>
    <button matButton="filled" (click)="reservaList()">Reservas</button>    

    <!-- Opciones de menú exclusivas para administradores -->
    @if (administrador()) {
      <button matButton="filled" (click)="puestoList()">Puestos</button>
      <button matButton="filled" (click)="salaList()">Salas</button>
      <button matButton="filled" (click)="usuarioList()">Usuarios</button>
    }

    <div class="logout">
      <button matButton="filled" (click)="profile()">Perfil</button>
      <button matButton="filled"  (click)="logout()">Cerrar sesión</button>
    </div>
  </mat-toolbar>
}
