<div class="container">
  
  <h1>Registro</h1>

  @if(registerForm) {
    <form [formGroup]="registerForm" (ngSubmit)="register()">
   
      <!-- Nombre -->
      <section>
        <app-input-text
          label="Nombre"
          [control]="nombre"
          type="text"
          errorMessage="Nombre no es válido">
        </app-input-text>
      </section>

      <!-- Primer apellido -->
      <section>
        <app-input-text
          label="Primer apellido"
          [control]="primerApellido"
          type="text"
          errorMessage="Primer apellido no es válido">
        </app-input-text>
      </section>

      <!-- Segundo apellido -->
      <section>
        <app-input-text
          label="Segundo apellido"
          [control]="segundoApellido"
          type="text"
          errorMessage="Segundo apellido no es válido">
        </app-input-text>
      </section>

      <!-- Correo corporativo -->
      <section>
        <app-input-email
          label="Correo"
          [control]="correoCorporativo"
          placeholder="ejemplo@email.com"
          errorMessage="El correo electrónico introducido no es válido"
        ></app-input-email>
      </section> 

      <!-- Contraseña -->
      <section>
        <app-input-password
          label="Contraseña"
          [control]="contrasenia"
          errorMessage="La contraseña no tiene un formato válido"
        ></app-input-password>
      </section>

      <!-- Botón para enviar la información -->
      <section class="form-button-section">
        <button matButton type="submit">Registrar usuario</button>
      </section>
    </form>
  }
</div>
