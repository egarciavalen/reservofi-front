<div class="container">

  <h1>Inicio de sesión</h1>

  @if(loginForm) {

    <form [formGroup]="loginForm" (ngSubmit)="login()">

      <!-- Correo corporativo -->
      <section>
        <app-input-email
          label="Correo"
          [control]="correoCorporativo"
          placeholder="ejemplo@email.com"
          errorMessage="El correo electrónico introducido no es válido"
        ></app-input-email>
      </section> 

      <!-- Contraseña -->
      <section>
        <app-input-password
          label="Contraseña"
          [control]="contrasenia"
          errorMessage="La contraseña no tiene un formato válido"
        ></app-input-password>
      </section>

      <!-- Botón para enviar la información -->
      <section class="form-button-section">
        <button matButton type="submit">Iniciar sesión</button>
      </section>
  </form>
  }
</div>
